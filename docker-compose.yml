services:

  # --- Media Server (portale Netflix-like) ---
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - JELLYFIN_PublishedServerUrl=https://${DOMAIN:?DOMAIN must be set}
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      - ${MOVIES_DIR}:/media/movies:ro
      - ${TV_DIR}:/media/tv:ro
    restart: unless-stopped
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- Film (automazione) ---
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DOWNLOADS_DIR}:/downloads
      - ${MOVIES_DIR}:/movies
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:7878:7878"
    restart: unless-stopped
    networks:
      - private
    depends_on:
      qbittorrent:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- Serie TV (automazione) ---
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DOWNLOADS_DIR}:/downloads
      - ${TV_DIR}:/tv
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:8989:8989"
    restart: unless-stopped
    networks:
      - private
    depends_on:
      qbittorrent:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- Indexer Manager ---
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:9696:9696"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    networks:
      - private
    depends_on:
      flaresolverr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- Client Torrent ---
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${DOWNLOADS_DIR}:/downloads
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set}:8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- Bypass Cloudflare per indexer ---
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8191/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- Reverse proxy ---
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CONFIG_DIR}/caddy/data:/data
      - ${CONFIG_DIR}/caddy/config:/config
      - ${CONFIG_DIR}/caddy/logs:/var/log/caddy
    restart: unless-stopped
    networks:
      - public
    depends_on:
      - jellyfin
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- DDNS updater (aggiorna il record DNS quando cambia l'IP pubblico) ---
  # La configurazione effettiva va in ${CONFIG_DIR}/ddclient/ddclient.conf.
  # Il container linuxserver/ddclient crea un file di esempio al primo avvio:
  #   docker compose run --rm ddclient cat /config/ddclient.conf
  # Personalizzarlo con il provider scelto (es. DuckDNS, Cloudflare, No-IP).
  # Esempio per DuckDNS:
  #   daemon=300
  #   protocol=duckdns
  #   login=token
  #   password=<DUCKDNS_TOKEN>
  #   <tuo-sottodominio>.duckdns.org
  # Esempio per Cloudflare:
  #   protocol=cloudflare
  #   login=<EMAIL>
  #   password=<CF_API_TOKEN>
  #   zone=<DOMAIN>
  #   <SUBDOMAIN>
  #
  # Healthcheck: ddclient non espone endpoint HTTP, quindi non è possibile
  # verificare la salute tramite curl. Il container è considerato sano se
  # il processo ddclient è in esecuzione; Docker lo rileva già tramite
  # la policy restart=unless-stopped. Un healthcheck basato su pgrep
  # sarebbe inaffidabile perché dipende dal PID namespace del container.
  ddclient:
    image: linuxserver/ddclient:latest
    container_name: ddclient
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/ddclient:/config
    restart: unless-stopped
    # ddclient e' outbound-only: non ha bisogno di nessuna rete interna

networks:
  public:
    name: mediaserver-public
    driver: bridge
  private:
    name: mediaserver-private
    driver: bridge
