services:

  # --- Media Server (portale Netflix-like) ---
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - JELLYFIN_PublishedServerUrl=${HOSTNAME:-localhost}
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      - ${MOVIES_DIR}:/media/movies:ro
      - ${TV_DIR}:/media/tv:ro
    ports:
      - "8096:8096"
    restart: unless-stopped
    networks:
      - mediaserver
    depends_on:
      - radarr
      - sonarr

  # --- Film (automazione) ---
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DOWNLOADS_DIR}:/downloads
      - ${MOVIES_DIR}:/movies
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - mediaserver
    depends_on:
      - qbittorrent
      - prowlarr

  # --- Serie TV (automazione) ---
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DOWNLOADS_DIR}:/downloads
      - ${TV_DIR}:/tv
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - mediaserver
    depends_on:
      - qbittorrent
      - prowlarr

  # --- Indexer Manager ---
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    ports:
      - "9696:9696"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    networks:
      - mediaserver
    depends_on:
      - flaresolverr

  # --- Client Torrent ---
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${DOWNLOADS_DIR}:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    networks:
      - mediaserver

  # --- Bypass Cloudflare per indexer ---
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - "8191:8191"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    networks:
      - mediaserver

networks:
  mediaserver:
    name: mediaserver
    driver: bridge
