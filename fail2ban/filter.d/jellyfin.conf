# =============================================================================
# fail2ban filter — Jellyfin (log formato testo proprietario)
# =============================================================================
#
# DEPLOY:
#   sudo cp /home/gabbo/MediaServer/fail2ban/filter.d/jellyfin.conf \
#           /etc/fail2ban/filter.d/jellyfin.conf
#   sudo systemctl reload fail2ban
#
# !!! PREREQUISITO OBBLIGATORIO !!!
# Abilitare questa jail SOLO dopo aver configurato "Known Proxies" in Jellyfin:
#   Dashboard → Networking → Known Proxies
#   Aggiungi l'IP del container Caddy (es. 172.18.0.x).
#   Verifica IP: docker inspect caddy | grep '"IPAddress"'
# Senza questa configurazione, i log di Jellyfin registreranno l'IP interno
# di Caddy invece dell'IP reale del client, causando il ban di Caddy stesso.
#
# NOTA LIVELLO LOG:
#   Jellyfin logga i fallimenti di autenticazione a livello INF (non ERR/WRN).
#   Assicurati che il log level di Jellyfin sia almeno "Information".
#
# TEST FILTRO:
#   sudo fail2ban-regex \
#     __CONFIG_DIR__/jellyfin/log/jellyfin*.log \
#     /etc/fail2ban/filter.d/jellyfin.conf \
#     --print-all-matched
#
# FORMATO LOG JELLYFIN (esempio reale):
# [2024-01-15 10:30:45.123 +00:00] [INF] [55] Jellyfin.Api.Auth:
#   Authentication request for "utente" has been denied (IP: "1.2.3.4").
# =============================================================================

[INCLUDES]
before = common.conf

[Definition]

# Datepattern: corrisponde al timestamp Jellyfin nel formato
# [YYYY-MM-DD HH:MM:SS.mmm +HH:MM]
datepattern = \[%%Y-%%m-%%d %%H:%%M:%%S\.%%f [+-]%%H:%%M\]

# failregex: cattura l'IP dal messaggio di autenticazione fallita.
# Jellyfin logga i fallimenti auth a livello INF con il formato:
#   Authentication request for "<user>" has been denied (IP: "<ip>").
failregex = ^\[.+\] \[INF\] \[\d+\] .*Authentication request for ".*" has been denied \(IP: "<HOST>"\)\.$

ignoreregex =
