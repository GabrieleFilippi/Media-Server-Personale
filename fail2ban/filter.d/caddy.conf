# =============================================================================
# fail2ban filter — Caddy v2 (log formato JSON)
# =============================================================================
#
# DEPLOY:
#   sudo cp /home/gabbo/MediaServer/fail2ban/filter.d/caddy.conf \
#           /etc/fail2ban/filter.d/caddy.conf
#   sudo systemctl reload fail2ban
#
# TEST FILTRO (prima del deploy):
#   sudo fail2ban-regex \
#     __CONFIG_DIR__/caddy/logs/access.log \
#     /etc/fail2ban/filter.d/caddy.conf \
#     --print-all-matched
#
# FORMATO LOG CADDY v2 (JSON, una riga per richiesta):
# {"level":"info","ts":1700000000.123,"logger":"http.log.access",
#  "msg":"handled request",
#  "request":{"remote_ip":"1.2.3.4","client_ip":"1.2.3.4","method":"GET","uri":"/api/..."},
#  "status":401,"duration":0.001}
# =============================================================================

[INCLUDES]
before = common.conf

[Definition]

# Timestamp: Caddy v2 scrive unix epoch float nel campo "ts".
# fail2ban supporta {Epoch} per parsare questo formato.
datepattern = "ts":{Epoch}

# Regex: cattura l'IP da "client_ip" o "remote_ip" dentro il blocco "request":{...}
# quando lo status HTTP e' 401 (Unauthorized) o 403 (Forbidden).
#
# NOTA: "remote_ip" e' l'IP TCP, "client_ip" e' l'IP reale se X-Forwarded-For
# e' configurato. Copriamo entrambi per compatibilita'.
failregex = ^.*"request":\{[^}]*"(?:client_ip|remote_ip)":"<HOST>"[^}]*\}.*"status":(?:401|403)\b.*$

ignoreregex =
